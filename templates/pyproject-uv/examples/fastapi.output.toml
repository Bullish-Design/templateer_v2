[project]
name = "fastapi-app"
description = "A FastAPI web application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.0",
  "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "W",
]
ignore = [
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = [
  "-v",
  "--tb=short",
]
