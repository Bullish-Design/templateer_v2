name: pyproject-uv
description: Generate a uv-style pyproject.toml for a Python project.

outputs:
  - path: pyproject.toml
    kind: full_file
    language: toml

schema:
  module: schema
  class: PyprojectUvModel

prompt:
  file: prompt.md

renderer:
  engine: minijinja
  file: template.j2

strict_context: true

triggers:
  filenames:
    - pyproject.toml
