name: pyproject-uv
description: Generate a uv-style pyproject.toml for a Python project.

output:
  path: pyproject.toml
  language: toml

schema:
  module: schema
  class: PyprojectUvModel

prompt:
  file: prompt.md

renderer:
  engine: minijinja
  file: template.j2

trigger_filenames:
  - pyproject.toml
